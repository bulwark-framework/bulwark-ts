name: ci

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The SDK defaults cached downloads to the system temporary directory.
      - uses: actions/cache@v4
        with:
          path: /tmp/temporal-test-server-*
          key: temporal-test-server-${{ runner.os }}-${{ runner.arch }}-1.24.0
      - run: pnpm test
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
